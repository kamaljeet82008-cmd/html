<!DOCTYPE html>
<html>

<head>

    <title>Employee Table</title>

    <style>
        table {
            border: 2px solid black;

            border-collapse: separate;

            border-spacing: 5px;
        }

        th,
        td {

            border: 2px solid black;

            padding: 10px;
        }
    </style>

</head>

<body>

    <table>

        <!-- Heading Row -->

        <tr>

            <th>Name</th>

            <th>Job Title</th>

            <th>Email Address</th>

        </tr>

        <!-- Data Row 1 -->

        <tr>

            <td>Kamaljeet</td>

            <td>Web Developer</td>

            <td>kamal@gmail.com</td>

        </tr>

        <!-- Data Row 2 -->

        <tr>

            <td>Rahul</td>

            <td>Designer</td>

            <td>rahul@gmail.com</td>

        </tr>

        <!-- Data Row 3 -->

        <tr>

            <td>Simran</td>

            <td>Software Engineer</td>

            <td>simran@gmail.com</td>

        </tr>

    </table>

</body>

</html>
